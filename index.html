

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jogo WWII 3D - Mobile & PC</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { overflow: hidden; background-color: #000; font-family: sans-serif; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 15, 0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10; text-align: center;
        }
        h1 { color: #d4af37; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        .btn {
            background: #4a5d3e; color: white; border: 2px solid #6b8e23;
            padding: 12px 24px; margin: 8px; font-size: 18px; cursor: pointer;
            border-radius: 4px; font-weight: bold; width: 220px;
        }
        .btn:active { background: #6b8e23; }

        #hud {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; pointer-events: none; z-index: 5;
            font-size: 16px; font-weight: bold; text-shadow: 1px 1px 2px #000;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            background: rgba(255, 255, 255, 0.6); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 5;
        }

        .mobile-ctrl {
            position: absolute; bottom: 20px; z-index: 6; display: flex; gap: 10px;
        }
        #touch-joystick { 
            position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px; 
            background: rgba(255,255,255,0.1); border-radius: 60px; border: 2px solid rgba(255,255,255,0.3); 
            touch-action: none; z-index: 6;
        }
        #stick {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            background: rgba(255,255,255,0.4); border-radius: 50%; pointer-events: none;
        }
        #weapon-buttons { right: 20px; flex-direction: column; }
        .action-btn { width: 60px; height: 60px; background: rgba(200,0,0,0.6); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid #fff; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>

    <div id="hud" style="display:none;">
        <div>FASE: <span id="ui-level">1</span>/12</div>
        <div>NATION: <span id="ui-nation">-</span></div>
        <div>ARMA: <span id="ui-weapon">Fuzil</span></div>
        <div>MUNIÇÃO: <span id="ui-ammo">30</span></div>
        <div>INIMIGOS: <span id="ui-enemies">0</span></div>
    </div>

    <div id="menu-screen" class="screen">
        <h1>WWII: Frente de Batalha</h1>
        <p style="margin-bottom: 20px;">Escolha seu Exército (Dificuldade: Fácil)</p>
        <button class="btn" onclick="selectNation('US')">EUA (Americano)</button>
        <button class="btn" onclick="selectNation('JP')">Japão (Japonês)</button>
        <button class="btn" onclick="selectNation('GER')">Alemanha (Alemão)</button>
    </div>

    <div id="end-screen" class="screen" style="display:none;">
        <h1 id="end-title">Fim de Jogo</h1>
        <button class="btn" onclick="restartGame()">Jogar Novamente</button>
    </div>

    <div id="touch-joystick" style="display:none;">
        <div id="stick"></div>
    </div>

    <div id="weapon-buttons" class="mobile-ctrl" style="display:none;">
        <div style="display:flex; gap:5px;">
            <button class="btn" style="width:50px; padding:5px;" onclick="setWeapon(1)">1</button>
            <button class="btn" style="width:50px; padding:5px;" onclick="setWeapon(2)">2</button>
            <button class="btn" style="width:50px; padding:5px;" onclick="setWeapon(3)">3</button>
        </div>
        <button class="action-btn" id="btn-fire" style="margin-top:10px;">ATIRAR</button>
    </div>

    <script>
        let scene, camera, renderer;
        let player = { nation: '', currentWeapon: 1, ammo: 50, health: 100 };
        let level = 1;
        let enemies = [], ammoBoxes = [], sceneryObjects = [];
        let isGameRunning = false;
        let joystickMove = { x: 0, y: 0 };

        const weaponsData = {
            1: { name: 'Pistola', damage: 35, range: 40, isMelee: false },
            2: { name: 'Fuzil', damage: 75, range: 100, isMelee: false },
            3: { name: 'Baioneta', damage: 100, range: 4, isMelee: true }
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'shoot') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'explosion') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(80, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
                osc.start(); osc.stop(audioCtx.currentTime + 0.6);
            } else if (type === 'pickup') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            }
        }

        function initEngine() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x333333);
            scene.fog = new THREE.FogExp2(0x333333, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.8, 0);
            camera.rotation.order = 'YXZ';

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x666666);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            window.addEventListener('resize', onWindowResize);
            setupControls();
        }

        function createBattlefield() {
            sceneryObjects.forEach(obj => scene.remove(obj));
            enemies.forEach(e => scene.remove(e.mesh));
            ammoBoxes.forEach(a => scene.remove(a.mesh));
            sceneryObjects = []; enemies = []; ammoBoxes = [];

            camera.position.set(0, 1.8, 0);

            const floorGeo = new THREE.PlaneGeometry(200, 200);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x2b1d0c });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);
            sceneryObjects.push(floor);

            for (let i = 0; i < 8; i++) {
                const wallGeo = new THREE.BoxGeometry(10, 2.5, 1);
                const wallMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
                const wall = new THREE.Mesh(wallGeo, wallMat);
                wall.position.set((Math.random() - 0.5) * 80, 1.25, (Math.random() - 0.5) * 80);
                
                for(let j = 0; j < 3; j++) {
                    const hole = new THREE.Mesh(new THREE.CircleGeometry(0.1, 8), new THREE.MeshBasicMaterial({color: 0x000000}));
                    hole.position.set((Math.random()-0.5)*8, (Math.random()-0.5)*2, 0.51);
                    wall.add(hole);
                }
                scene.add(wall);
                sceneryObjects.push(wall);
            }

            const vehicle = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(4, 2, 6), new THREE.MeshStandardMaterial({color: 0x111111}));
            body.position.y = 1;
            vehicle.add(body);
            
            const fireGeo = new THREE.SphereGeometry(0.8, 8, 8);
            const fireMat = new THREE.MeshBasicMaterial({color: 0xff4500, wireframe: true});
            const fire = new THREE.Mesh(fireGeo, fireMat);
            fire.position.set(0, 2.5, 0);
            vehicle.add(fire);
            vehicle.position.set(-15, 0, -20);
            scene.add(vehicle);
            sceneryObjects.push(vehicle);

            for (let i = 0; i < 5; i++) {
                const box = new THREE.Mesh(
                    new THREE.BoxGeometry(1, 1, 1),
                    new THREE.MeshStandardMaterial({ color: 0x00ff00 })
                );
                box.position.set((Math.random() - 0.5) * 60, 0.5, (Math.random() - 0.5) * 60);
                scene.add(box);
                ammoBoxes.push({ mesh: box, active: true });
            }

            spawnEnemies();
        }

        function spawnEnemies() {
            const numEnemies = level * 3;
            for (let i = 0; i < numEnemies; i++) {
                const enemyMesh = new THREE.Group();
                
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.8), new THREE.MeshStandardMaterial({ color: 0x800000 }));
                body.position.y = 0.9;
                enemyMesh.add(body);

                enemyMesh.position.set((Math.random() - 0.5) * 80, 0, -20 - Math.random() * 40);
                scene.add(enemyMesh);

                enemies.push({
                    mesh: enemyMesh,
                    health: 50,
                    speed: 0.03 + (level * 0.005)
                });
            }
            updateHUD();
        }

        const keys = {};
        function setupControls() {
            window.addEventListener('keydown', e => {
                keys[e.key.toLowerCase()] = true;
                if (e.key === '1') setWeapon(1);
                if (e.key === '2') setWeapon(2);
                if (e.key === '3') setWeapon(3);
            });
            window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

            const canvas = renderer.domElement;
            canvas.addEventListener('click', () => {
                if (isGameRunning) {
                    canvas.requestPointerLock();
                    shoot();
                }
            });

            document.addEventListener('mousemove', e => {
                if (document.pointerLockElement === canvas && isGameRunning) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
                }
            });

            document.getElementById('btn-fire').addEventListener('click', (e) => {
                e.stopPropagation();
                if (isGameRunning) shoot();
            });

            // Controle de mira no mobile (Lado direito da tela)
            let touchStartX = 0, touchStartY = 0;
            window.addEventListener('touchstart', e => {
                const touch = e.touches[0];
                if (touch.clientX > window.innerWidth / 2) {
                    touchStartX = touch.clientX;
                    touchStartY = touch.clientY;
                }
            });
            window.addEventListener('touchmove', e => {
                if (!isGameRunning) return;
                for (let i = 0; i < e.touches.length; i++) {
                    const touch = e.touches[i];
                    if (touch.clientX > window.innerWidth / 2) {
                        const deltaX = touch.clientX - touchStartX;
                        const deltaY = touch.clientY - touchStartY;
                        camera.rotation.y -= deltaX * 0.005;
                        camera.rotation.x -= deltaY * 0.005;
                        camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
                        touchStartX = touch.clientX;
                        touchStartY = touch.clientY;
                    }
                }
            });

            // Lógica do Joystick para Mobile (Lado esquerdo)
            const joystick = document.getElementById('touch-joystick');
            const stick = document.getElementById('stick');
            let joyTouchId = null;

            joystick.addEventListener('touchstart', e => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                joyTouchId = touch.identifier;
            });

            window.addEventListener('touchmove', e => {
                if (joyTouchId === null) return;
                for (let i = 0; i < e.touches.length; i++) {
                    if (e.touches[i].identifier === joyTouchId) {
                        const touch = e.touches[i];
                        const rect = joystick.getBoundingClientRect();
                        const centerX = rect.left + rect.width / 2;
                        const centerY = rect.top + rect.height / 2;
                        let dx = touch.clientX - centerX;
                        let dy = touch.clientY - centerY;
                        const dist = Math.hypot(dx, dy);
                        const maxDist = 40;
                        if (dist > maxDist) {
                            dx = (dx / dist) * maxDist;
                            dy = (dy / dist) * maxDist;
                        }
                        stick.style.transform = `translate(${dx}px, ${dy}px)`;
                        joystickMove.x = dx / maxDist;
                        joystickMove.y = dy / maxDist;
                    }
                }
            });

            const resetJoystick = (e) => {
                if (joyTouchId === null) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === joyTouchId) {
                        joyTouchId = null;
                        stick.style.transform = `translate(0px, 0px)`;
                        joystickMove.x = 0;
                        joystickMove.y = 0;
                    }
                }
            };
            window.addEventListener('touchend', resetJoystick);
            window.addEventListener('touchcancel', resetJoystick);
        }

        function setWeapon(id) {
            player.currentWeapon = id;
            updateHUD();
        }

        function shoot() {
            const weapon = weaponsData[player.currentWeapon];

            if (!weapon.isMelee) {
                if (player.ammo <= 0) return;
                player.ammo--;
                playSound('shoot');
            } else {
                playSound('shoot');
            }

            updateHUD();

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                const intersects = raycaster.intersectObject(enemy.mesh, true);
                if (intersects.length > 0 && intersects[0].distance <= weapon.range) {
                    enemy.health -= weapon.damage;
                    
                    if (enemy.health <= 0) {
                        scene.remove(enemy.mesh);
                        enemies.splice(i, 1);
                        playSound('explosion');
                        updateHUD();

                        if (enemies.length === 0) {
                            nextLevel();
                        }
                    }
                    break;
                }
            }
        }

        function selectNation(nation) {
            player.nation = nation;
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            document.getElementById('weapon-buttons').style.display = 'flex';
            if ('ontouchstart' in window) {
                document.getElementById('touch-joystick').style.display = 'block';
            }
            
            initEngine();
            createBattlefield();
            isGameRunning = true;
            animate();
        }

        function nextLevel() {
            if (level < 12) {
                level++;
                alert(`Fase ${level - 1} Concluída! Avançando para a Fase ${level}...`);
                createBattlefield();
            } else {
                endGame(true);
            }
        }

        function endGame(won) {
            isGameRunning = false;
            if (document.exitPointerLock) document.exitPointerLock();
            document.getElementById('end-screen').style.display = 'flex';
            document.getElementById('end-title').innerText = won ? "VOCÊ VENCEU A GUERRA!" : "VOCÊ FOI ABATIDO!";
        }

        function restartGame() {
            level = 1;
            player.ammo = 50;
            player.health = 100;
            document.getElementById('end-screen').style.display = 'none';
            createBattlefield();
            isGameRunning = true;
            animate();
        }

        function updateHUD() {
            document.getElementById('ui-level').innerText = level;
            document.getElementById('ui-nation').innerText = player.nation;
            document.getElementById('ui-weapon').innerText = weaponsData[player.currentWeapon].name;
            document.getElementById('ui-ammo').innerText = weaponsData[player.currentWeapon].isMelee ? "∞" : player.ammo;
            document.getElementById('ui-enemies').innerText = enemies.length;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            if (!isGameRunning) return;
            requestAnimationFrame(animate);

            // --- MOVIMENTO DO JOGADOR ---
            const speed = 0.15;
            const moveDir = new THREE.Vector3();

            if (keys['w']) moveDir.z -= 1;
            if (keys['s']) moveDir.z += 1;
            if (keys['a']) moveDir.x -= 1;
            if (keys['d']) moveDir.x += 1;

            if (joystickMove.x !== 0 || joystickMove.y !== 0) {
                moveDir.x = joystickMove.x;
                moveDir.z = joystickMove.y;
            }

            if (moveDir.length() > 0) {
                moveDir.normalize();
                moveDir.applyEuler(new THREE.Euler(0, camera.rotation.y, 0));
                camera.position.addScaledVector(moveDir, speed);
            }
            camera.position.y = 1.8;

            // --- MOVIMENTO E IA DOS INIMIGOS ---
            enemies.forEach(enemy => {
                // Orienta o inimigo para o jogador
                enemy.mesh.lookAt(camera.position.x, enemy.mesh.position.y, camera.position.z);
                
                // Correção do vetor de avanço
                const targetDir = new THREE.Vector3();
                targetDir.subVectors(camera.position, enemy.mesh.position);
                targetDir.y = 0; 
                targetDir.normalize();
                
                enemy.mesh.position.addScaledVector(targetDir, enemy.speed);

                // Dano ao jogador ao se aproximar
                const dist = enemy.mesh.position.distanceTo(camera.position);
                if (dist < 1.5) {
                    player.health -= 0.5;
                    if (player.health <= 0) endGame(false);
                }
            });

            // --- COLETA DE MUNIÇÃO ---
            ammoBoxes.forEach(box => {
                if (box.active && camera.position.distanceTo(box.mesh.position) < 2) {
                    box.active = false;
                    scene.remove(box.mesh);
                    player.ammo += 20;
                    playSound('pickup');
                    updateHUD();
                }
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
